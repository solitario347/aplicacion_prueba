{% extends 'base.html' %}
{% block content %}
<h2>Catálogo de Eventos</h2>
{% for event in events %}
    <div>
        <h3>{{ event.title }} ({{ event.category }})</h3>
        <p>{{ event.description }}</p>
        <p>Fecha: {{ event.date }} | Cupo: {{ event.capacity }}</p>
        
        {% if current_user.role == 'attendee' %}
            <form action="{{ url_for('events.register_to_event', event_id=event.id) }}" method="POST" style="display:inline;">
                <button type="submit">Inscribirse</button>
            </form>
            <form action="{{ url_for('events.cancel_registration', event_id=event.id) }}" method="POST" style="display:inline;">
                <button type="submit">Cancelar Inscripción</button>
            </form>
        {% endif %}
    </div>
    <hr>
{% endfor %}
{% endblock %}
