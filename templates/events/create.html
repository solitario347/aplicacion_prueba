{% extends 'base.html' %}
{% block content %}
<h2>Crear Evento</h2>
<form action="{{ url_for('events.create_event') }}" method="POST">
    Título: <input type="text" name="title" required><br><br>
    Descripción: <textarea name="description" required></textarea><br><br>
    Fecha y Hora: <input type="datetime-local" name="date" required><br><br>
    Cupo Máximo: <input type="number" name="capacity" required><br><br>
    Categoría: <input type="text" name="category" required><br><br>
    <button type="submit">Guardar Evento</button>
</form>
{% endblock %}
